[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: live external-source test; excluded from default CI",
  "slow: performance or large-batch test",
]

[tool.coverage.run]
branch = true
source = ["valuation", "data_provider", "india_sources", "stock_search", "batch_import", "watchlist_store", "watchlist_report", "corporate_monitor", "diagnostics", "secure_storage", "local_database", "background_processing", "ttl_cache", "fundamentals", "backtest"]
omit = ["tests/*", "create_project_report.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 55
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "except ImportError",
]

[tool.ruff]
target-version = "py311"
line-length = 220
exclude = [".build-venv", ".venv", "build", "dist", "installer_output"]

[tool.ruff.lint]
select = ["E9", "F", "I"]
